name: Generate Snake Game

on:
  schedule:
    # Se ejecuta cada 24 horas a medianoche
    - cron: "0 0 * * *"
  
  # Permite ejecutar manualmente la acción desde la pestaña Actions en GitHub
  workflow_dispatch:
  
  # Se ejecuta automáticamente en cada push a main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Genera la animación de la serpiente a partir de las contribuciones
      - name: Generar github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Sube los archivos generados a una rama llamada "output"
      - name: Publicar a la rama output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
